<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UGRATARA Admin Panel - Supabase Powered</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    try {
      google.charts.load('current', {'packages':['corechart']});
    } catch(e) {}
  </script>
  <style>
    body{ font-family:Arial,sans-serif; background:#f5f5f5; margin:0; padding:20px; }
    h2{ color:#e91e63; }
    .logout{ position:fixed; top:15px; right:15px; background:#f44336; color:#fff; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight: bold; z-index: 1000; }
    .bell-btn { position:fixed; top:12px; right:125px; background:#fff; border:2px solid #e91e63; font-size:22px; padding:6px 10px; border-radius:50%; cursor:pointer; z-index: 1000; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    .automation-badge { display: inline-block; background: #fff; border: 1px solid #4CAF50; color: #4CAF50; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; margin-left: 12px; vertical-align: middle; }
    table { width:100%; border-collapse:collapse; background:#fff; margin-top:20px; box-shadow:0 2px 5px rgba(0,0,0,0.05); }
    th{ background:#e91e63; color:#fff; padding:12px; font-size:14px; }
    td{ padding:10px; border:1px solid #ddd; text-align:center; font-size:14px; }
    select, input{ padding:8px; border-radius:6px; border:1px solid #ccc; margin:3px; box-sizing: border-box; }
    .rcvBtn { background:#4CAF50; color:white; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; }
    .rdyBtn { background:#9C27B0; color:white; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; }
    .updateBtn { background:#2196F3; color:white; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; }
    .addBtn { background:#e91e63; color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; }
    .editBtn { background:#2196F3; color:white; border:none; padding:5px 10px; border-radius:4px; font-weight:bold; cursor:pointer; margin:2px; }
    .removeBtn { background:#f44336; color:white; border:none; padding:5px 10px; border-radius:4px; font-weight:bold; cursor:pointer; margin:2px; }
    .staff-section, .menu-section, .inventory-section, .salary-section, .chat-section { background:#fff; padding:20px; border-radius:10px; margin-top:40px; border:1px solid #ddd; display:block; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .login-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#f5f5f5; display:flex; justify-content:center; align-items:center; z-index:99999; }
    .login-card { background:#fff; padding:30px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.1); width:100%; max-width:360px; text-align:center; }
    .login-card input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; font-size:16px; }
    .login-card button { width:100%; padding:12px; background:#e91e63; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; }
    .proof-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #ccc; display: inline-block; }
    .inStockBtn { background:#4CAF50; color:white; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer; margin:2px; display: inline-flex; align-items: center; gap: 5px; }
    .outStockBtn { background:#ff9800; color:white; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer; margin:2px; }
  </style>
</head>
<body>

<audio id="notificationAudio" preload="auto">
  <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<div id="loginScreen" class="login-overlay">
  <div class="login-card">
    <h2>🔐 STAFF LOGIN</h2>
    <input id="username" type="text" placeholder="Username / Email" autocomplete="off" value="admin@ugratara.com">
    <input id="password" type="password" placeholder="Password" autocomplete="off" value="123456">
    <button id="loginBtn" onclick="window.handleLogin()">Login</button>
  </div>
</div>

<div id="adminContent" style="display:none;">
  <button id="systemBellAlertBtn" class="bell-btn" onclick="window.testBellSound()" title="Test Sound">🔔</button>
  <button id="globalLogoutBtn" class="logout" onclick="window.logout()">Logout</button>
  
  <h2>
    🍴 UGRATARA Admin Panel (<span id="userRoleBadge" style="color:#e91e63;">...</span>)
    <span class="automation-badge">Supabase: 🟢 Active</span>
  </h2>

  <!-- 👥 Staff & Access Management Section -->
  <div id="staffManagementBox" class="staff-section">
    <h3 style="color: #e91e63; margin-bottom: 15px; font-size: 18px;">👥 Staff & Access Management</h3>
    
    <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd;">
      <h4 style="margin-bottom: 10px; color: #333;">+ Add New Staff</h4>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input id="staffUsername" type="text" placeholder="Username / Email" style="flex: 1; min-width: 180px; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
        <input id="staffPassword" type="password" placeholder="Password" style="flex: 1; min-width: 150px; padding: 10px; border-radius: 6px; border: 1px solid #ccc;">
        <input id="staffRoleInput" type="text" placeholder="Role (e.g. Driver, Cook, Salesman)" style="flex: 1; min-width: 150px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-weight: bold;">
        <button class="addBtn" onclick="window.createNewStaff()">+ Add Staff</button>
      </div>
    </div>

    <h4 style="margin-bottom: 10px; color: #333;">Current Staff Members</h4>
    <div style="overflow-x: auto; width: 100%;">
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Password</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="staffTableList">
          <tr><td colspan="5" style="padding: 15px;">Loading staff members...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://lorhrfdqzagulicwcctx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_YxubnsG5x3QD_OaPzEEy_w_wzLVLSlW';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var myRole = "admin";

  // 🔔 अडियो घण्टी बज्ने फंक्सन
  window.playTringTringBell = function() {
    try {
      const audio = document.getElementById("notificationAudio");
      if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
    } catch(e) {}
  };

  window.testBellSound = function() {
    window.playTringTringBell();
    alert("🔔 घण्टी सुचारु भयो!");
  };

  // 🔐 सुरक्षित र त्रुटिरहित लगइन प्रमाणीकरण
  window.handleLogin = async function() {
    var u = document.getElementById("username").value.trim().toLowerCase();
    var p = document.getElementById("password").value.trim();
    if(u === "" || p === "") { alert("कृपया युजरनेम र पासवर्ड लेख्नुहोस्!"); return; }
    
    let btn = document.getElementById("loginBtn");
    btn.innerText = "Verifying...";
    btn.disabled = true;

    try {
      let { data, error } = await supabaseClient.from('admins').select('*');
      btn.innerText = "Login";
      btn.disabled = false;

      let matchedStaff = null;
      if (!error && data && data.length > 0) {
        matchedStaff = data.find(staff => String(staff.email || staff.username || "").trim().toLowerCase() === u && String(staff.password || "").trim() === p);
      }

      // अफलाइन वा इमर्जेन्सी ब्याकअप (Admin र Manager दुवैका लागि)
      if (!matchedStaff) {
        if (u === "admin@ugratara.com" && p === "123456") {
          matchedStaff = { email: "admin@ugratara.com", role: "admin" };
        } else if (u === "manager@ugratara.com" && p === "123456") {
          matchedStaff = { email: "manager@ugratara.com", role: "manager" };
        }
      }

      if (!matchedStaff) {
        alert("❌ गलत युजरनेम वा पासवर्ड! कृपया फेरि प्रयास गर्नुहोस्।");
        return;
      }

      let assignedRole = matchedStaff.role ? String(matchedStaff.role).trim() : "admin";

      sessionStorage.setItem("ADMIN_LOGIN", "true");
      sessionStorage.setItem("USER_ROLE", assignedRole);
      sessionStorage.setItem("LOGGED_USER", u);
      
      myRole = assignedRole;
      window.showAdminPanel();
    } catch(err) {
      btn.innerText = "Login";
      btn.disabled = false;
      alert("⚠️ लगइन गर्दा त्रुटि भयो: " + err.message);
    }
  };

  // 👥 स्टाफ सूची लोड गर्ने र Manager हुँदा Admin/Manager लुकाउने लजिक
  window.loadStaffList = async function() {
    let staffTable = document.getElementById("staffTableList");
    if (!staffTable) return;
    
    let { data } = await supabaseClient.from('admins').select('*').order('id', { ascending: true });
    let staffData = (data && data.length > 0) ? data : [
      { id: 1, email: "admin@ugratara.com", password: "123", role: "admin", status: "Active" },
      { id: 2, email: "manager@ugratara.com", password: "123", role: "manager", status: "Active" },
      { id: 3, email: "driver1@ugratara.com", password: "123", role: "Driver", status: "Active" }
    ];
    
    let currentRole = String(sessionStorage.getItem("USER_ROLE") || "").toLowerCase();
    
    // यदि लगइन गर्ने व्यक्ति Manager हो भने 'admin' र 'manager' रोल भएकाहरूलाई लुकाउने (Filter गर्ने)
    if (currentRole === "manager") {
      staffData = staffData.filter(staff => {
        let r = String(staff.role || "").toLowerCase();
        return r !== "admin" && r !== "manager";
      });
    }

    let html = "";
    staffData.forEach(staff => {
      let uName = staff.email || staff.username || '';
      let uPass = staff.password || '';
      let uRole = staff.role || '';
      let uStatus = staff.status || 'Active';
      let statusBtnClass = uStatus === 'Active' ? 'inStockBtn' : 'outStockBtn';
      let statusText = uStatus === 'Active' ? '🟢 Active' : '🔴 Inactive';

      html += `<tr>
        <td><b>${uName}</b></td>
        <td>${uPass}</td>
        <td><b>${uRole}</b></td>
        <td>${uStatus}</td>
        <td>
          <button class="${statusBtnClass}" onclick="window.toggleStaffStatus(this, '${uStatus}')" style="padding:5px 8px; font-size:12px;">${statusText}</button>
          <button class="editBtn" onclick="window.editStaff(${staff.id || 1}, '${uName}', '${uPass}', '${uRole}')">✏️ Edit</button>
          <button class="removeBtn" onclick="window.deleteStaff(${staff.id || 1})">❌ Delete</button>
        </td>
      </tr>`;
    });
    staffTable.innerHTML = html || `<tr><td colspan="5">No staff found.</td></tr>`;
  };

  window.toggleStaffStatus = function(btnElement, currentStatus) {
    let newStatus = currentStatus === 'Active' ? 'Inactive' : 'Active';
    let row = btnElement.closest('tr');
    if (row) {
      row.cells[3].innerText = newStatus;
      btnElement.innerText = newStatus === 'Active' ? '🟢 Active' : '🔴 Inactive';
      btnElement.className = newStatus === 'Active' ? 'inStockBtn' : 'outStockBtn';
      btnElement.setAttribute('onclick', `window.toggleStaffStatus(this, '${newStatus}')`);
    }
  };

  window.editStaff = async function(staffId, oldEmail, oldPass, oldRole) {
    let newEmail = prompt("Edit Username / Email:", oldEmail);
    if (newEmail === null) return;
    let newPass = prompt("Edit Password:", oldPass);
    if (newPass === null) return;
    let newRole = prompt("Edit Role:", oldRole);
    if (newRole === null) return;

    let currentRole = String(sessionStorage.getItem("USER_ROLE") || "").toLowerCase();
    if (currentRole === "manager") {
      let r = newRole.trim().toLowerCase();
      if (r === "admin" || r === "manager") {
        alert("⚠️ म्यानेजरले 'Admin' वा 'Manager' रोल राख्न मिल्दैन!");
        return;
      }
    }

    await supabaseClient.from('admins').update({ email: newEmail, password: newPass, role: newRole }).eq('id', staffId);
    alert("✅ Staff Updated Successfully!");
    window.loadStaffList();
  };

  window.createNewStaff = async function() {
    let username = document.getElementById("staffUsername").value.trim();
    let password = document.getElementById("staffPassword").value.trim();
    let role = document.getElementById("staffRoleInput").value.trim();
    if (!username || !password || !role) { alert("Enter Username, Password and Role!"); return; }

    let currentRole = String(sessionStorage.getItem("USER_ROLE") || "").toLowerCase();
    if (currentRole === "manager") {
      let r = role.toLowerCase();
      if (r === "admin" || r === "manager") {
        alert("⚠️ म्यानेजरले 'Admin' वा 'Manager' रोल भएका नयाँ युजरहरू थप्न मिल्दैन!");
        return;
      }
    }

    await supabaseClient.from('admins').insert([{ email: username, password: password, role: role }]);
    alert("✅ Staff Added!");
    document.getElementById("staffUsername").value = "";
    document.getElementById("staffPassword").value = "";
    document.getElementById("staffRoleInput").value = "";
    window.loadStaffList();
  };

  window.deleteStaff = async function(staffId) {
    if (confirm("Delete staff?")) {
      await supabaseClient.from('admins').delete().eq('id', staffId);
      window.loadStaffList();
    }
  };

  window.showAdminPanel = function() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminContent").style.display = "block";
    window.myRole = String(sessionStorage.getItem("USER_ROLE") || "admin").toUpperCase();
     
    let roleBadge = document.getElementById("userRoleBadge");
    if(roleBadge) roleBadge.innerText = window.myRole;

    window.loadStaffList();
  };

  window.logout = function() { sessionStorage.clear(); window.location.reload(); };

  if (sessionStorage.getItem("ADMIN_LOGIN") === "true") {
    window.showAdminPanel();
  } else {
    document.getElementById("loginScreen").style.display = "flex";
  }
</script>
</body>
</html>
