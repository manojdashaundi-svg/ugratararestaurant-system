<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UGRATARA Admin Panel - Supabase Powered</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    try { google.charts.load('current', {'packages':['corechart']}); } catch(e) {}
  </script>
  <style>
    body{ font-family:Arial,sans-serif; background:#f5f5f5; margin:0; padding:20px; }
    h2{ color:#e91e63; }
    .logout{ position:fixed; top:15px; right:15px; background:#f44336; color:#fff; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight: bold; z-index: 1000; }
    .bell-btn { position:fixed; top:12px; right:125px; background:#fff; border:2px solid #e91e63; font-size:22px; padding:6px 10px; border-radius:50%; cursor:pointer; z-index: 1000; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    table { width:100%; border-collapse:collapse; background:#fff; margin-top:20px; box-shadow:0 2px 5px rgba(0,0,0,0.05); }
    th{ background:#e91e63; color:#fff; padding:12px; font-size:14px; text-align: center; }
    td{ padding:10px; border:1px solid #ddd; text-align:center; font-size:14px; vertical-align: middle; }
    select, input{ padding:8px; border-radius:6px; border:1px solid #ccc; margin:3px; box-sizing: border-box; }
    .rcvBtn { background:#4CAF50; color:white; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; }
    .addBtn { background:#e91e63; color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; }
    
    /* हुबहु बटन डिजाइनहरू */
    .inStockBtn { background:#4CAF50; color:white; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer; margin:2px; display: inline-flex; align-items: center; gap: 5px; }
    .outStockBtn { background:#ff9800; color:white; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer; margin:2px; }
    .editBtn { background:#2196F3; color:white; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer; margin:2px; }
    .removeBtn { background:#f44336; color:white; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer; margin:2px; }
    
    .menu-section { background:#fff; padding:20px; border-radius:10px; margin-top:40px; border:1px solid #ddd; display:none; }
    .login-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#f5f5f5; display:flex; justify-content:center; align-items:center; z-index:99999; }
    .login-card { background:#fff; padding:30px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.1); width:100%; max-width:360px; text-align:center; }
    .login-card input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; font-size:16px; }
    .login-card button { width:100%; padding:12px; background:#e91e63; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; }
    .proof-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
    .menu-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
  </style>
</head>
<body>

<div id="loginScreen" class="login-overlay">
  <div class="login-card">
    <h2>🔐 STAFF LOGIN</h2>
    <input id="username" type="text" placeholder="Email" autocomplete="off">
    <input id="password" type="password" placeholder="Password" autocomplete="off">
    <button id="loginBtn" onclick="handleLogin()">Login</button>
  </div>
</div>

<div id="adminContent" style="display:none;">
  <button class="bell-btn" onclick="alert('🔔 घण्टी बज्यो!')">🔔</button>
  <button class="logout" onclick="window.logout()">Logout</button>
  
  <h2>🍴 UGRATARA Admin Panel (ADMIN)</h2>

  <!-- 🛒 अर्डर तालिका -->
  <div style="margin-top:20px;">
    <h3>🛒 Active Orders</h3>
    <table>
      <thead>
        <tr><th>Order Date & Time</th><th>Order No.</th><th>Customer</th><th>Total</th><th>Payment Slip</th><th>Status</th><th>Action</th></tr>
      </thead>
      <tbody id="ordersTable"><tr><td colspan="7">Loading...</td></tr></tbody>
    </table>
  </div>

  <!-- 🍔 मेनु म्यानेजमेन्ट (हुबहु डिजाइन) -->
  <div id="menuManagementBox" class="menu-section" style="display:block;">
    <div style="background:#f9f9f9; padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #ddd;">
      <input id="prodId" type="text" placeholder="Item ID">
      <input id="prodName" type="text" placeholder="Product Name">
      <input id="prodPrice" type="number" placeholder="Price">
      <input id="prodImg" type="text" placeholder="Image URL">
      <input id="prodDesc" type="text" placeholder="Description">
      <input id="prodCat" type="text" placeholder="Category">
      <button class="addBtn" onclick="window.createNewProduct()">+ Add Product</button>
    </div>
    
    <h3>Current Food Items</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Food Name</th>
          <th>Price</th>
          <th>Image</th>
          <th>Description</th>
          <th>Category</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="menuTableList"></tbody>
    </table>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://lorhrfdqzagulicwcctx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_YxubnsG5x3QD_OApZEEy_w_wzLVLSlw';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.handleLogin = async function() {
    var u = document.getElementById("username").value.trim();
    var p = document.getElementById("password").value.trim();
    let { data } = await supabaseClient.from('admins').select('*').eq('email', u).eq('password', p).single();
    if (data) {
      sessionStorage.setItem("ADMIN_LOGIN", "true");
      window.showAdminPanel();
    } else { alert("Wrong Email or Password."); }
  };

  window.loadOrders = async function() {
    let { data } = await supabaseClient.from('orders').select('*');
    var tableBody = document.getElementById("ordersTable");
    if(!tableBody) return;
    let html = "";
    (data || []).forEach(o => {
      let slipHtml = o.payment_slip ? `<img src="${o.payment_slip}" class="proof-thumb">` : `None`;
      html += `<tr><td>${o.time||'-'}</td><td><b>${o.order_no}</b></td><td>${o.customer_name||'-'}</td><td style="color:#e91e63; font-weight:bold;">RM ${o.total||'0'}</td><td>${slipHtml}</td><td>${o.status||'Pending'}</td><td><button class="rcvBtn" onclick="updateOrderStatus('${o.order_no}')">✅ Complete</button></td></tr>`;
    });
    tableBody.innerHTML = html || `<tr><td colspan="7">No Orders</td></tr>`;
  };

  window.updateOrderStatus = async function(orderNo) {
    await supabaseClient.from('orders').update({ status: 'Delivered' }).eq('order_no', orderNo);
    window.loadOrders();
  };

  // मेनु लोड गर्ने र हुबहु डिजाइन देखाउने
  // मेनु लोड गर्ने सुरक्षित तरिका
  window.loadMenuList = async function() {
    let { data, error } = await supabaseClient.from('menu_items').select('*');
    if(error) { 
      console.log("Menu load error:", error); 
      alert("Error loading menu: " + error.message);
      return; 
    }

    var menuList = document.getElementById("menuTableList");
    if(!menuList) return;
    
    if(!data || data.length === 0) {
      menuList.innerHTML = `<tr><td colspan="7">No Food Items Found in Supabase. Please add a product above.</td></tr>`;
      return;
    }

    let html = "";
    data.forEach((r) => {
      let itemId = r.item_id || r.id || r.Item_ID || '';
      let imgTag = r.image ? `<img src="${r.image}" class="menu-thumb">` : `No Image`;
      let stockStatus = r.status || "In Stock";
      let stockBtnClass = stockStatus === "In Stock" ? "inStockBtn" : "outStockBtn";
      let stockText = stockStatus === "In Stock" ? "🟢 In Stock" : "🔴 Out of Stock";

      html += `<tr>
        <td><b>${itemId}</b></td>
        <td><b>${r.name || r.Food_Name || ''}</b></td>
        <td style="color:#e91e63; font-weight:bold;">RM ${r.price || r.Price || 0}</td>
        <td>${imgTag}</td>
        <td>${r.description || r.Description || ''}</td>
        <td><b>${r.category || r.Category || ''}</b></td>
        <td>
          <button class="${stockBtnClass}" onclick="window.toggleStock('${itemId}', '${stockStatus}')">${stockText}</button>
          <button class="editBtn" onclick="window.editProduct('${itemId}', '${r.name || r.Food_Name}', ${r.price || r.Price}, '${r.description || r.Description || ''}', '${r.category || r.Category || ''}')">✏️ Edit</button>
          <button class="removeBtn" onclick="window.deleteProduct('${itemId}')">❌ Delete</button>
        </td>
      </tr>`;
    });
    menuList.innerHTML = html;
  };

  // स्टक स्टाटस फेरेर Supabase मा स्वतः सेभ गर्ने
  window.toggleStock = async function(id, currentStatus) {
    let newStatus = currentStatus === "In Stock" ? "Out of Stock" : "In Stock";
    await supabaseClient.from('menu_items').update({ status: newStatus }).eq('item_id', id);
    window.loadMenuList();
  };

  window.createNewProduct = async function() {
    var id = document.getElementById("prodId").value.trim();
    var name = document.getElementById("prodName").value.trim();
    var price = parseFloat(document.getElementById("prodPrice").value) || 0;
    var img = document.getElementById("prodImg").value.trim();
    var desc = document.getElementById("prodDesc").value.trim();
    var cat = document.getElementById("prodCat").value.trim();

    if(!name || !price) { alert("Enter Name and Price!"); return; }

    let insertData = { name, price, image: img, description: desc, category: cat, status: "In Stock" };
    if(id) insertData.item_id = id;

    let { error } = await supabaseClient.from('menu_items').insert([insertData]);
    if(error) { alert("Error: " + error.message); } else { alert("✅ Saved to Supabase!"); window.loadMenuList(); }
  };

  // एडिट गरेर Supabase मा स्वतः सेभ गर्ने
  window.editProduct = async function(id, oldName, oldPrice, oldDesc, oldCat) {
    var newName = prompt("Edit Name:", oldName); if(newName === null) return;
    var newPrice = parseFloat(prompt("Edit Price:", oldPrice)) || oldPrice;
    var newDesc = prompt("Edit Description:", oldDesc); if(newDesc === null) return;
    var newCat = prompt("Edit Category:", oldCat); if(newCat === null) return;

    let { error } = await supabaseClient.from('menu_items')
      .update({ name: newName, price: newPrice, description: newDesc, category: newCat })
      .eq('item_id', id);

    if(error) { alert("Error updating!"); } else { alert("✅ Successfully Updated & Saved to Supabase!"); window.loadMenuList(); }
  };

  window.deleteProduct = async function(id) {
    if(confirm("Delete this item?")) {
      await supabaseClient.from('menu_items').delete().eq('item_id', id);
      window.loadMenuList();
    }
  };

  window.showAdminPanel = function() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminContent").style.display = "block";
    window.loadOrders();
    window.loadMenuList();
  };

  window.logout = function() { sessionStorage.clear(); window.location.reload(); };

  if (sessionStorage.getItem("ADMIN_LOGIN") === "true") { window.showAdminPanel(); }
  else { document.getElementById("loginScreen").style.display = "flex"; }
</script>
</body>
</html>
